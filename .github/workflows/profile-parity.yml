name: Profile parity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      PYTHONIOENCODING: utf-8
      PROFILE_PRIVATE_REPO_DENYLIST: ${{ secrets.PROFILE_PRIVATE_REPO_DENYLIST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Run all profile contracts
        run: python -m pytest -q -p no:cacheprovider
      - name: Run PowerShell privacy guard
        shell: pwsh
        run: ./tests/profile_privacy.ps1
